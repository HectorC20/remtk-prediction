# Infraestructura Qdrant propia de remtk-prediction (desarrollo local).
# El hook `predev` (pnpm dev) levanta este servicio automáticamente si el
# puerto 6333 está cerrado. Arranque manual: docker compose up -d qdrant
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: remtk_prediction_qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
