# remtk-prediction — Tool Prediction Server en Rust Nativo (Tokio + Axum + ort v2)
# Arquitectura de ultra-baja memoria (< 88 MB RSS) que reemplaza al antiguo servidor NestJS.
#
# Servicios:
#   - qdrant     → motor Qdrant (recall BM25), puerto 6333
#   - prediction → API de predicción (6776), modelos (6777) y API Qdrant (6775) en Rust
#
# Uso:
#   docker compose up -d          # levanta Qdrant + servidor Rust
#   docker compose up -d qdrant   # solo Qdrant (p. ej. para desarrollo en host)
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: remtk_prediction_qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  prediction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remtk_prediction
    restart: unless-stopped
    ports:
      - "6776:6776" # API de predicción y Juicio MoE
      - "6777:6777" # API de modelos (e5-small)
      - "6775:6775" # API Qdrant / Recall del servicio
    environment:
      PORT_PREDICT: 6776
      PORT_EMBED: 6777
      PORT_QDRANT: 6775
      MODELS_PATH: /app/models
      ONNX_MODELS_PATH: /app/models
      ONNX_MODEL_SIZE: small
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      LOGS_DIR: /app/logs
      LOG_TO_FILE: "true"
      RUST_LOG: info,remtk_prediction_server=debug,profiler=info,prediction_trace=info,http_trace=info
    volumes:
      # Modelos ONNX: bind mount de solo lectura para mmap compartido
      - ./models:/app/models:ro
      # Archivos de log rotativos diarios (prediction-YYYY-MM-DD.log)
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 128M # Techo estricto: el binario Rust opera en < 88 MB RSS
        reservations:
          cpus: "0.5"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6776/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 2s
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
